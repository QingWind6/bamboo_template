; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[base_lib_deps]
lib_deps =
	https://github.com/adafruit/Adafruit_SHT4X.git#76a06edfa280a699da1c2f311bdeccb0bd5cee92
	https://github.com/mathertel/OneButton.git
	https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    https://github.com/Bodmer/TFT_eSPI.git

	; https://github.com/takkaO/OpenFontRender.git


    https://github.com/QingWind6/BambooLoop.git
    https://github.com/QingWind6/litekv.git
	https://github.com/QingWind6/simple_log.git

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_ldf_mode = deep
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-std=gnu++17

build_unflags =
	-std=gnu++11

lib_deps = 
    ${base_lib_deps.lib_deps}

monitor_speed = 115200
monitor_filters = colorize
